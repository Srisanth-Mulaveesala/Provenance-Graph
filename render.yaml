services:
  - type: web
    name: provenance-graph-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: CPP_ENGINE_PATH
        value: /app/provenance_engine
      - key: PROVENANCE_STORE_PATH
        value: /tmp/provenance-store.json
      - key: CORS_ORIGINS
        value: https://provenance-graph.onrender.com